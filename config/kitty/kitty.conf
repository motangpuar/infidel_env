#include colors.conf
#include chalk.conf
include seoul256-light.conf

font_family      0xProto Nerd Font
#font_family Agave
#font_family SpaceMono Nerd Font
#font_family RecMonoCasual Nerd Font
#font_family FantasqueSansM Nerd Font
#font_family EnvyCodeR Nerd Font
#font_family GoMono Nerd Font

font_size 11.75


bold_font        auto
italic_font      auto
bold_italic_font auto

# Custom Tab
#
tab_bar_edge bottom
tab_bar_margin_height 5.0 5.0
tab_bar_min_tabs 1
tab_bar_style custom
tab_powerline_style slanted
tab_title_template "{fmt.fg.default}{index}"
tab_bar_background #003747
active_tab_foreground #FFFFFF
inactive_tab_foreground #888888
active_tab_background #458588
#inactive_tab_background #1e1e2e
#tab_bar_margin_color #1e1e2e
tab_title_template "{index}: {title}"


